name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mundo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK dependencies
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;24.0.8215888"

      - name: Generate local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          cat local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Step 1 - Validate Gradle project loading
        run: ./gradlew --no-daemon help --stacktrace --info

      - name: Step 2 - Build debug APK
        run: ./gradlew --no-daemon assembleDebug -x lint -x test --stacktrace --info

      - name: Dump Gradle daemon log on failure
        if: failure()
        run: |
          find ~/.gradle/daemon -name "daemon-*.out.log" -print -exec tail -n 300 {} \;

      - name: Upload build reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            mundo/app/build/reports/**
            mundo/**/build/outputs/logs/**
